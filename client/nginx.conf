# Preserve incoming protocol from Cloudflare / reverse proxy, falling back to $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Determine Connection header for WebSockets vs standard HTTP polling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 50MB uploads (matching server multer capabilities)
    client_max_body_size 50M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # React Single Page App (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache control
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Proxy backend API routes directly to the server container
    location ~ ^/(api|auth|oauth|session|utils)(/|$) {
        proxy_pass http://server:6969;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy Socket.io WebSockets
    location /socket.io/ {
        proxy_pass http://server:6969;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}


